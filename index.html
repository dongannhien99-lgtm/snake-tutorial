<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        canvas {
            border: 3px solid #4CAF50;
            background-color: #000000;
        }

        .score-board {
            font-size: 24px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="score-board">Punktestand: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const $ = id => document.getElementById(id);

        let canvas = $("gameCanvas");
        let ctx = canvas.getContext("2d");
        let scoreElement = $("score");
        let gridSize = 20;
        let tileCount = canvas.width / gridSize;
        let snake = [
            {
                x: 10,
                y: 10,
            }
        ];
        let food = {
            x: 15,
            y: 15
        };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameInterval;

        document.addEventListener("keydown", changeDirection);
        gameInterval = setInterval(gameLoop, 400);

        function gameLoop() {
            if (isGameOver()) {
                clearInterval(gameInterval);
                alert("Game over! Dein Punktestand: " + score);
                return;
            }

            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? "#4caf50" : "#388e3c";
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = {
                x: snake[0].x + dx,
                y: snake[0].y + dy,
            };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function changeDirection(event) {
            let keyPressed = event.keyCode;

            let LEFT_KEY = 37;
            let UP_KEY = 38;
            let RIGHT_KEY = 39;
            let DOWN_KEY = 40;

            let goingRight = dx === 1;
            let goingLeft = dx === -1;
            let goingDown = dy === 1;
            let goingUp = dy === -1;

            if (keyPressed === LEFT_KEY && !goingRight) {
                dx = -1;
                dy = 0;
            }

            if (keyPressed === UP_KEY && !goingDown) {
                dx = 0;
                dy = -1;
            }

            if (keyPressed === RIGHT_KEY && !goingLeft) {
                dx = 1;
                dy = 0;
            }

            if (keyPressed === DOWN_KEY && !goingUp) {
                dx = 0;
                dy = 1;
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            snake.forEach(segment => {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                }
            });
        }

        function drawFood() {
            ctx.fillStyle = "#FF5722";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function isGameOver() {
            let hitLeftWall = snake[0].x < 0;
            let hitRightWall = snake[0].x >= tileCount;
            let hitTopWall = snake[0].y < 0;
            let hitBottomWall = snake[0].y >= tileCount;

            if (hitLeftWall || hitRightWall || hitTopWall || hitBottomWall) {
                return true;
            }

            for (let i = 1; i < snake.length; i++) {
                if (snake[0].x === snake[i].x && snake[0].y === snake[i].y) {
                    return true;
                }
            }

            return false;
        }
    </script>
</body>

</html>
